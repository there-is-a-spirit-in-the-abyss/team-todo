[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-todo-ui"
version = "0.1.0"
description = "Self-hosted team task trees with local accounts and five languages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["team_todo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
